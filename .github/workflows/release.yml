name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HACS archive
        run: zip -r hacs-hiveos-monitor.zip custom_components hacs.json README.md LICENSE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" hacs-hiveos-monitor.zip --clobber
          else
            gh release create "${{ github.ref_name }}" hacs-hiveos-monitor.zip \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
